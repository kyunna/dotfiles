# ============================================================
# Run or Raise - PPPP Leader Keymap
# ============================================================
#
# Leader key:
#   F19
#
# Physical mappings:
#   ThinkPad Right Alt -> Kanata -> F19
#   QMK keyboards      -> KC_F19
#
# Format: shortcut,desktop_id,wm_class,title
# ============================================================

# Direct
# Files (Nautilus)
<Super>e,org.gnome.Nautilus.desktop,org.gnome.Nautilus,

# A - AI
# ChatGPT
F19 a g,chatgpt.desktop,Chatgpt,

# B - Browser
# Zen Browser
F19 b z,zen.desktop,zen,
# Google Chrome
F19 b c,google-chrome.desktop,google-chrome,

# D - Daily
# Ghostty
F19 d d,com.mitchellh.ghostty.desktop,com.mitchellh.ghostty,
# Heynote
F19 d f,heynote.desktop,Heynote,
# Hylki
F19 d e,co.hyprlab.Hylki.desktop,co.hyprlab.Hylki,
# Bitwarden
F19 d q,bitwarden.desktop,Bitwarden,
# LocalSend
F19 d s,localsend.desktop,org.localsend.localsend_app,

# M - Media
# Spotify
F19 m s,spotify-launcher.desktop,Spotify,

# N - Network
# NordVPN
F19 n v,nordvpn-gui.desktop,nordvpn-gui,
